{% load scitex_static %}
<section class="live-paper-status" aria-label="Manuscript information">
  <p id="live-paper-loading" role="status">Loading manuscript…</p>
  <div id="live-paper-bundle-header" hidden></div>
  <div class="lp-reader-actions">
    {% if not empty_reason %}<button type="button" class="stx-button lp-reader-evidence-toggle" aria-controls="live-paper-claims" aria-expanded="false">Claim evidence</button>{% endif %}
    <a id="live-paper-download-pdf" hidden>Download PDF</a>
    <details class="lp-pdf-variants" data-export-src="{% app_static 'live_paper/js/pdf-export-entry.js' %}" hidden>
      <summary>PDF variants</summary>
      <button type="button" data-pdf-export="highlights">With highlights</button>
      <button type="button" data-pdf-export="graph" disabled>With highlights and selected graph</button>
      <span role="status"></span>
    </details>
    {% if project_tools_url %}<a href="{{ project_tools_url }}">Open project tools</a>{% endif %}
    {% if manuscript_url %}<a href="{{ manuscript_url }}">Read manuscript with evidence</a>{% endif %}
    <details id="live-paper-bundle-diagnostics" hidden>
      <summary>Bundle diagnostics</summary>
      <pre id="live-paper-bundle-info">{}</pre>
    </details>
  </div>
</section>
{% if not empty_reason %}
<div class="lp-verification-banner" id="live-paper-trace-status" hidden></div>
<div class="lp-reader-workspace">
  <section aria-label="Manuscript" tabindex="0" class="lp-reader-document">
    <div id="live-paper-pdf" class="live-paper-pdf"></div>
  </section>
  <aside aria-label="Claim evidence" id="live-paper-claims" class="live-paper-claims" hidden></aside>
</div>
{% endif %}
