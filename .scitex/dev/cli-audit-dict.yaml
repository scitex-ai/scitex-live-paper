# scitex-dev audit-cli — per-package vocabulary additions for scitex-live-paper.
#
# Format expected by scitex_dev/_cli/audit/_summary/_audit.py::_load_custom_dict():
#   nouns:              [...]
#   transitive_verbs:   [...]
#   intransitive_verbs: [...]
#
# Keys must match exactly. The auditor merges this dict with its base
# catalog + Moby POS, then classifies each CLI sub-command token. A token
# listed here OVERRIDES the catalog/Moby classification (custom dict wins),
# so a noun-homonym placed under `intransitive_verbs:` is treated as a
# complete (intransitive) verb and no longer trips §1. This is the
# documented escape hatch the §1 violation message points to (the same one
# `scitex-todo next` uses).

intransitive_verbs:
  # `scitex-live-paper serve` — run the standalone Django dev server pinned
  # to a bundle. The action is a complete unit ("serve this bundle"); Moby
  # classifies "serve" as both noun AND verb. Renaming to `start-serve`
  # would break the established command and read worse than the
  # `docker serve` / `scitex-cards serve` idiom operators already expect.
  - serve

  # `scitex-live-paper info` — print a one-screen sanity summary of a
  # bundle. The action is a complete unit ("report on this bundle");
  # "info" reads as a noun to the bare token classifier but the verb
  # meaning is intended here, matching the `scitex-clew info` idiom.
  - info

  # `scitex-live-paper hub-manifest` — print the scitex-hub workspace
  # manifest as JSON. Whole-token lookup: "hub-manifest" as a unit is the
  # intransitive verb "emit-the-hub-manifest" with options supplying the
  # overrides; splitting it into verb-first form (`show-hub-manifest`)
  # would churn the established surface for no operator benefit.
  - hub-manifest
