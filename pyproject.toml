[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-live-paper"
version = "0.5.3"
description = "Interactive, AI-verifiable live rendering of research manuscripts (provider-neutral evidence states for registered claims). Part of SciTeX."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "noreply@scitex.ai" },
]
keywords = [
    "scitex",
    "live-paper",
    "interactive-paper",
    "claims",
    "evidence",
    "viewer",
    "ara",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "scitex-dev>=0.11.7",
    "scitex-logging>=0.1.0",
    # Static exports consume the canonical SDK assets without requiring Django.
    "scitex-sdk>=0.3.25",
    "click>=8.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
]
# Standalone + host integration: the SDK supplies the shared App/UI
# contracts and mount. Use the same qualified SDK runtime minimum as core.
server = [
    "django>=4.2",
    "scitex-sdk[gui]>=0.3.25",
]
mcp = [
    "fastmcp>=2.0",
]
docs = [
    # Generated CLI docs use sphinx-click's pre-9 autodoc mock API.
    "sphinx>=7.0,<9",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-click>=6.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
test = [
    "pytest>=8.0",
    "build>=1.2",
    # Validates the shipped evidence-report / review-packet JSON Schemas.
    "jsonschema>=4.18",
]
# `pip install scitex-live-paper[all]` must pull EVERYTHING public (PS-221).
# PS-221: public extras are closed under `[all]` — CI installs `.[all,dev]`.
all = [
    "scitex-live-paper[django,server,mcp,test,docs]",
]
# `dev` toolchain extra — the org pytest-matrix reusable installs
# `.[all,dev]`; without a `dev` extra the chain falls back to a bare
# `-e .` and pytest is missing (exit 4). Mirrors the org leaf convention.
dev = [
    "pytest-asyncio",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0.0",
    "scitex-rich-pdf==0.1.2",
    # PS-210: [mcp] tool tests introspect fastmcp; declare it here so a
    # fresh `pip install -e .[dev]` (without [all]) still runs them.
    "fastmcp>=2.0",
    "scitex-live-paper[all]",
]

[project.scripts]
scitex-live-paper = "scitex_live_paper._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-live-paper = "scitex_live_paper"

[project.entry-points."scitex_dev.skills"]
scitex-live-paper = "scitex_live_paper"

[project.entry-points."scitex.livepaper.renderers"]
figz-default = "scitex_live_paper.ports._figz_adapter:FigzDefaultEntry"

# Hub plugin discovery (thin-hub rule): `pip install` is the whole
# install. The group name contains a dot, so it MUST stay QUOTED.
# The host mounts `scitex_live_paper._django.urls` at the manifest
# route (apps/live-paper/) and lists the launcher tile from
# `_django/manifest.json`. Without this, `loaded_plugin_configs()`
# never sees the leaf and the mount silently does nothing.
[project.entry-points."scitex.apps"]
live-paper = "scitex_live_paper._django.apps:LivePaperConfig"

[project.urls]
Documentation = "https://scitex-live-paper.readthedocs.io"
Homepage = "https://github.com/ywatanabe1989/scitex-live-paper"
Repository = "https://github.com/ywatanabe1989/scitex-live-paper"
Issues = "https://github.com/ywatanabe1989/scitex-live-paper/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
scitex_live_paper = [
    "_skills/scitex-live-paper/*.md",
    "_skills/scitex-live-paper/references/*.md",
    "_sphinx_html/*",
    "_sphinx_html/**/*",
    "_sphinx_html/.buildinfo",
    "evidence/*.json",
    "package.json",
    "_django/manifest.json",
    "_django/templates/live_paper/*.html",
    "_renderer/templates/*.j2",
    "_renderer/assets/*.css",
    "_renderer/assets/*.js",
    "_renderer/assets/mermaid/*.js",
    "_renderer/assets/mermaid/*.md",
    "_renderer/assets/pdfjs/*.mjs",
    "_renderer/assets/pdfjs/*.md",
    "_django/static/live_paper/js/*.js",
    "_django/static/live_paper/js/*.d.ts",
    "_django/static/live_paper/css/*.css",
    "_django/static/live_paper/js/vendor/*.js",
    "_django/static/live_paper/js/vendor/*.md",
    "_django/static/live_paper/pdfjs/*.mjs",
    "_django/static/live_paper/pdfjs/*.md",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scitex_live_paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: fast CLI happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows against real subsystems (runs on every PR)",
]
