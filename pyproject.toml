[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-live-paper"
version = "0.2.12"
description = "Interactive, AI-verifiable live rendering of research manuscripts (consumer of scitex-clew claim model). Part of SciTeX."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "noreply@scitex.ai" },
]
keywords = [
    "scitex",
    "live-paper",
    "interactive-paper",
    "claims",
    "clew",
    "viewer",
    "ara",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "scitex-dev>=0.11.7",
    "scitex-logging>=0.1.0",
    "scitex-ui>=0.1.0",
    "click>=8.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
]
# Standalone + host integration: the SDK supplies the shared App/UI
# contracts and mount. Mirrors the scitex-stats [server] extra floor.
server = [
    "django>=4.2",
    "scitex-sdk[gui]>=0.3.7",
]
mcp = [
    "fastmcp>=2.0",
]
# scitex-clew owns the claim model + the live `verify_claim()` operation.
# Without this extra, the M2 `api/claim/verify` (and `api/claims/verify`)
# endpoints degrade gracefully to `fallback: true` per-result so the SPA
# badge stays meaningful — but the operator never gets a real verify.
# Install with: `pip install scitex-live-paper[clew]`.
clew = [
    "scitex-clew>=0.1.0",
]
test = [
    "pytest>=8.0",
]
# `pip install scitex-live-paper[all]` must pull EVERYTHING public (PS-221).
# PS-221: public extras are closed under `[all]` — CI installs `.[all,dev]`.
all = [
    "scitex-live-paper[clew,django,server,mcp,test]",
]
# `dev` toolchain extra — the org pytest-matrix reusable installs
# `.[all,dev]`; without a `dev` extra the chain falls back to a bare
# `-e .` and pytest is missing (exit 4). Mirrors the org leaf convention.
dev = [
    "pytest-asyncio",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0.0",
    # PS-210: [mcp] tool tests introspect fastmcp; declare it here so a
    # fresh `pip install -e .[dev]` (without [all]) still runs them.
    "fastmcp>=2.0",
    "scitex-live-paper[all]",
]

[project.scripts]
scitex-live-paper = "scitex_live_paper._cli:main"

[project.entry-points."scitex.livepaper.renderers"]
figz-default = "scitex_live_paper.ports._figz_adapter:FigzDefaultEntry"

# Hub plugin discovery (thin-hub rule): `pip install` is the whole
# install. The group name contains a dot, so it MUST stay QUOTED.
# The host mounts `scitex_live_paper._django.urls` at the manifest
# route (apps/live-paper/) and lists the launcher tile from
# `_django/manifest.json`. Without this, `loaded_plugin_configs()`
# never sees the leaf and the mount silently does nothing.
[project.entry-points."scitex.apps"]
live-paper = "scitex_live_paper._django.apps:LivePaperConfig"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-live-paper"
Repository = "https://github.com/ywatanabe1989/scitex-live-paper"
Issues = "https://github.com/ywatanabe1989/scitex-live-paper/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scitex_live_paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: fast CLI happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows against real subsystems (runs on every PR)",
]
